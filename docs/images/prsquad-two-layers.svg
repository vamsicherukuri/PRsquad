<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.6px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11.5px; }
      .pill { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 600; }
      .stage { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-style: italic; }
    </style>
  </defs>

  <!-- Canvas Card Background -->
  <rect x="0" y="0" width="880" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- TOP LAYER: DETERMINISTIC CONTROL PLANE -->
  <rect x="24" y="20" width="832" height="108" rx="12" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2" />
  
  <!-- Top Layer Header -->
  <text x="40" y="44" class="title" fill="#1E3A8A">🔒 DETERMINISTIC CONTROL PLANE</text>
  <rect x="674" y="29" width="166" height="20" rx="10" fill="#DBEAFE" />
  <text x="757" y="43" class="tag" fill="#1E40AF" text-anchor="middle">ZERO TRUST · MACHINE STATE</text>
  <text x="40" y="63" class="desc" fill="#2563EB">Enforces human gates, scope boundaries, branch lockdowns, and bounded repair loops</text>

  <!-- Top Layer Pills -->
  <g transform="translate(40, 76)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="154" height="26" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
    <text x="77" y="17" class="pill" fill="#1E3A8A" text-anchor="middle">Scope Gate (/approve)</text>

    <!-- Pill 2 -->
    <rect x="162" y="0" width="144" height="26" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
    <text x="234" y="17" class="pill" fill="#1E3A8A" text-anchor="middle">Write Barrier</text>

    <!-- Pill 3 -->
    <rect x="314" y="0" width="144" height="26" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
    <text x="386" y="17" class="pill" fill="#1E3A8A" text-anchor="middle">Shell Sandbox</text>

    <!-- Pill 4 -->
    <rect x="466" y="0" width="144" height="26" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
    <text x="538" y="17" class="pill" fill="#1E3A8A" text-anchor="middle">Max 3 Retries</text>

    <!-- Pill 5 -->
    <rect x="618" y="0" width="182" height="26" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1" />
    <text x="709" y="17" class="pill" fill="#1E3A8A" text-anchor="middle">PR Gate (/create-pr)</text>
  </g>

  <!-- CONNECTOR -->
  <line x1="440" y1="128" x2="440" y2="178" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 3" />
  <rect x="360" y="141" width="160" height="22" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="440" y="156" class="tag" fill="#475569" text-anchor="middle">CONSTRAINS &amp; VERIFIES ↓</text>

  <!-- BOTTOM LAYER: PROBABILISTIC CODING AGENTS -->
  <rect x="24" y="178" width="832" height="114" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
  
  <!-- Bottom Layer Header -->
  <text x="40" y="202" class="title" fill="#065F46">🧠 PROBABILISTIC CODING AGENTS</text>
  <rect x="670" y="187" width="170" height="20" rx="10" fill="#D1FAE5" />
  <text x="755" y="201" class="tag" fill="#065F46" text-anchor="middle">LLM REASONING · ISOLATED ROLES</text>
  <text x="40" y="221" class="desc" fill="#059669">Triage issue, formulate root-cause plan, implement code, verify criteria, review diff, and prepare PR</text>

  <!-- Bottom Layer Pipeline Bar -->
  <g transform="translate(40, 236)">
    <rect x="0" y="0" width="800" height="42" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1" />
    
    <!-- Stage 1 -->
    <text x="45" y="25" class="stage" fill="#064E3B" text-anchor="middle">1. Triage</text>
    <text x="100" y="25" class="stage" fill="#34D399" text-anchor="middle">➔</text>
    
    <!-- Stage 2 -->
    <text x="165" y="25" class="stage" fill="#064E3B" text-anchor="middle">2. Architect</text>
    <text x="235" y="25" class="stage" fill="#34D399" text-anchor="middle">➔</text>
    
    <!-- Stage 3 -->
    <text x="305" y="25" class="stage" fill="#064E3B" text-anchor="middle">3. Developer</text>
    <text x="380" y="25" class="stage" fill="#34D399" text-anchor="middle">➔</text>
    
    <!-- Stage 4 -->
    <text x="440" y="25" class="stage" fill="#064E3B" text-anchor="middle">4. QA</text>
    <text x="500" y="25" class="stage" fill="#34D399" text-anchor="middle">➔</text>
    
    <!-- Stage 5 -->
    <text x="565" y="25" class="stage" fill="#064E3B" text-anchor="middle">5. Reviewer</text>
    <text x="635" y="25" class="stage" fill="#34D399" text-anchor="middle">➔</text>
    
    <!-- Stage 6 -->
    <rect x="670" y="7" width="118" height="28" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <text x="729" y="25" class="stage" fill="#047857" font-weight="700" text-anchor="middle">6. Pull Request</text>
  </g>

  <!-- FOOTER CAPTION -->
  <text x="440" y="318" class="caption" fill="#64748B" text-anchor="middle">"Agents decide how to solve the problem. The control plane decides what they are allowed to do and when they are allowed to proceed."</text>
</svg>
