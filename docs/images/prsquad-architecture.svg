<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" role="img" aria-label="PRsquad Supervised Agentic Workflow Architecture Diagram">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');

      :root {
        --bg: #FFFFFF;
        --surface: #F5F6F8;
        --surface-2: #EBEDF2;
        --border: #D3D7E0;
        --text: #1B2030;
        --text-muted: #5B6274;
        --accent: #2F5FA3;
        --accent-soft: #E4ECF7;
        --accent-text: #1E4A82;
        --good: #2E7D32;
        --warn: #9A6700;
        --warn-soft: #FFF8C5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0D1117;
          --surface: #161B22;
          --surface-2: #21262D;
          --border: #30363D;
          --text: #E7E9F0;
          --text-muted: #9AA1B4;
          --accent: #6E9EE0;
          --accent-soft: #1E2E45;
          --accent-text: #8FB4E8;
          --good: #4CAF50;
          --warn: #D89A55;
          --warn-soft: #382E14;
        }
      }
      .bg-rect { fill: var(--bg); }
      .legend-bg { fill: var(--surface); stroke: var(--border); stroke-width: 1px; rx: 8px; }
      .node-card { fill: var(--surface-2); stroke: var(--text-muted); stroke-width: 1.3px; rx: 8px; }
      .node-gate { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px; rx: 8px; }
      .node-native { fill: var(--surface); stroke: var(--text-muted); stroke-width: 1.3px; stroke-dasharray: 4 3; rx: 8px; }
      .node-title { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: var(--text); }
      .node-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; fill: var(--accent-text); letter-spacing: 0.05em; }
      .node-sub { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11.5px; fill: var(--text-muted); }
      .node-metric { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: var(--good); font-weight: 500; }
      .node-metric-val { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: var(--text); font-weight: 600; }
      .connector { stroke: var(--text-muted); stroke-width: 1.6px; fill: none; opacity: 0.75; }
      .loop-line { stroke: var(--accent); stroke-width: 1.6px; fill: none; stroke-dasharray: 4 4; }
      .loop-text-main { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; fill: var(--accent-text); font-weight: 500; }
      .loop-text-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; fill: var(--text-muted); }
      .legend-text { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 12px; fill: var(--text-muted); }
      .footer-note { font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 11.5px; fill: var(--text-muted); }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="var(--text-muted)"></path>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9 z" fill="var(--accent)"></path>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg-rect" />

  <!-- ================= TOP LEGEND BAR ================= -->
  <g transform="translate(30, 16)">
    <rect width="900" height="38" class="legend-bg" />
    
    <!-- Legend Item 1: Agent stage -->
    <rect x="20" y="12" width="14" height="14" rx="3" fill="var(--surface-2)" stroke="var(--text-muted)" stroke-width="1.3" />
    <text x="42" y="23" class="legend-text">Specialist Agent (scoped tools)</text>

    <!-- Legend Item 2: Human checkpoint -->
    <rect x="250" y="12" width="14" height="14" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8" />
    <text x="272" y="23" class="legend-text">Human Gate (blocks pipeline)</text>

    <!-- Legend Item 3: Native Action -->
    <rect x="475" y="12" width="14" height="14" rx="3" fill="var(--surface)" stroke="var(--text-muted)" stroke-width="1.3" stroke-dasharray="3 2" />
    <text x="497" y="23" class="legend-text">Native Action / Push Lock</text>

    <!-- Legend Item 4: Token driver bars -->
    <g transform="translate(690, 13)">
      <rect x="0" y="8" width="3" height="4" fill="var(--text-muted)" />
      <rect x="5" y="4" width="3" height="8" fill="var(--text-muted)" />
      <rect x="10" y="0" width="3" height="12" fill="var(--text-muted)" />
    </g>
    <text x="712" y="23" class="legend-text">Relative AIU Cost (low → high)</text>
  </g>

  <!-- ================= ROW 1 CONNECTORS ================= -->
  <g class="connector">
    <!-- S0 -> S1 -->
    <line x1="230" y1="120" x2="260" y2="120" marker-end="url(#arrow)"></line>
    <!-- S1 -> S2 -->
    <line x1="465" y1="120" x2="495" y2="120" marker-end="url(#arrow)"></line>
    <!-- S2 -> S2.5 Branch -->
    <line x1="700" y1="120" x2="730" y2="120" marker-end="url(#arrow)"></line>
  </g>

  <!-- ================= ROW 1 NODES (y=75 to 165) ================= -->

  <!-- STAGE 00: Triage Specialist -->
  <g transform="translate(30, 75)">
    <rect width="200" height="90" class="node-card" />
    <text x="14" y="24" class="node-eyebrow">00 · INTAKE TRIAGE</text>
    <text x="14" y="46" class="node-title">Triage Specialist</text>
    <text x="14" y="64" class="node-sub">@prsquad-triage · &lt;2s fast-fail</text>
    <text x="14" y="80" class="node-metric">1.33 AIU (0 if cached)</text>
  </g>

  <!-- STAGE 01: Architect Specialist -->
  <g transform="translate(265, 75)">
    <rect width="200" height="90" class="node-card" />
    <text x="14" y="24" class="node-eyebrow">01 · BLAST RADIUS</text>
    <text x="14" y="46" class="node-title">Architect Specialist</text>
    <text x="14" y="64" class="node-sub">@prsquad-architect · Read-only</text>
    <g transform="translate(14, 69)">
      <rect x="0" y="4" width="3" height="6" fill="var(--text)" />
      <rect x="5" y="2" width="3" height="8" fill="var(--text)" />
      <rect x="10" y="6" width="3" height="4" fill="var(--border)" />
    </g>
    <text x="34" y="79" class="node-metric-val">9.85 AIU (6 turns)</text>
  </g>

  <!-- STAGE 02: Scope Approval Gate (HARD BLOCK) -->
  <g transform="translate(500, 75)">
    <rect width="200" height="90" class="node-gate" />
    <text x="14" y="23" class="node-eyebrow" style="fill:var(--accent);">02 · HARD BLOCK GATE</text>
    <text x="14" y="46" class="node-title">Scope Approval Gate</text>
    <text x="14" y="64" class="node-sub">Human signs approval.lock</text>
    <text x="14" y="80" class="node-metric">— 0.00 AIU (Mechanical)</text>
  </g>

  <!-- STAGE 02.5: Branch Isolation -->
  <g transform="translate(735, 75)">
    <rect width="195" height="90" class="node-native" />
    <text x="14" y="24" class="node-eyebrow" style="fill:var(--text-muted);">02.5 · ISOLATION</text>
    <text x="14" y="46" class="node-title">Branch Isolated</text>
    <text x="14" y="64" class="node-sub">fix/issue-N · push locks</text>
    <text x="14" y="80" class="node-metric">— zero tokens (Native)</text>
  </g>

  <!-- ================= ROW TRANSITION ================= -->
  <!-- Sweeping connection from Row 1 Node 4 down to Row 2 Node 1 -->
  <path d="M 832,165 L 832,205 C 832,225 810,230 780,230 L 160,230 C 130,230 130,240 130,265" 
        stroke="var(--text-muted)" stroke-width="1.6" fill="none" opacity="0.65" marker-end="url(#arrow)" />
  <text x="480" y="224" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--good)">
    Maintainer /approve signs lock → Developer process unblocked
  </text>

  <!-- ================= RETRY LOOP (QA S4 back to Dev S3) ================= -->
  <path d="M 365,265 C 330,240 200,240 165,265" class="loop-line" marker-end="url(#arrowAccent)" />
  <text x="265" y="248" text-anchor="middle" class="loop-text-main">retry on fail (≤3×)</text>

  <!-- ================= ROW 2 CONNECTORS ================= -->
  <g class="connector">
    <!-- S3 Dev -> S4 QA -->
    <line x1="230" y1="310" x2="260" y2="310" marker-end="url(#arrow)"></line>
    <!-- S4 QA -> S5 Review -->
    <line x1="465" y1="310" x2="495" y2="310" marker-end="url(#arrow)"></line>
    <!-- S5 Review -> S6 PR Gate -->
    <line x1="700" y1="310" x2="730" y2="310" marker-end="url(#arrow)"></line>
  </g>

  <!-- ================= ROW 2 NODES (y=265 to 355) ================= -->

  <!-- STAGE 03: Developer Specialist -->
  <g transform="translate(30, 265)">
    <rect width="200" height="90" class="node-card" />
    <text x="14" y="24" class="node-eyebrow">03 · CONTAINED FIX</text>
    <text x="14" y="46" class="node-title">Developer Specialist</text>
    <text x="14" y="64" class="node-sub">@prsquad-dev · Write barrier</text>
    <g transform="translate(14, 69)">
      <rect x="0" y="0" width="3" height="10" fill="var(--text)" />
      <rect x="5" y="0" width="3" height="10" fill="var(--text)" />
      <rect x="10" y="0" width="3" height="10" fill="var(--text)" />
    </g>
    <text x="34" y="79" class="node-metric-val">25.28 AIU (16 turns)</text>
  </g>

  <!-- STAGE 04: QA Specialist -->
  <g transform="translate(265, 265)">
    <rect width="200" height="90" class="node-card" />
    <text x="14" y="24" class="node-eyebrow">04 · VERIFICATION</text>
    <text x="14" y="46" class="node-title">QA Specialist</text>
    <text x="14" y="64" class="node-sub">@prsquad-qa · Worktree tests</text>
    <g transform="translate(14, 69)">
      <rect x="0" y="4" width="3" height="6" fill="var(--text)" />
      <rect x="5" y="2" width="3" height="8" fill="var(--text)" />
      <rect x="10" y="6" width="3" height="4" fill="var(--border)" />
    </g>
    <text x="34" y="79" class="node-metric-val">13.60 AIU (55/55 PASS)</text>
  </g>

  <!-- STAGE 05: Reviewer Specialist -->
  <g transform="translate(500, 265)">
    <rect width="200" height="90" class="node-card" />
    <text x="14" y="24" class="node-eyebrow">05 · CONTRACT SWEEP</text>
    <text x="14" y="46" class="node-title">Reviewer Specialist</text>
    <text x="14" y="64" class="node-sub">@prsquad-review · AST sweep</text>
    <text x="14" y="80" class="node-metric">5.27 AIU (0-token engine)</text>
  </g>

  <!-- STAGE 06: PR Gate (DUAL REVIEW) -->
  <g transform="translate(735, 265)">
    <rect width="195" height="90" class="node-gate" />
    <text x="14" y="23" class="node-eyebrow" style="fill:var(--accent);">06 · DUAL REVIEW GATE</text>
    <text x="14" y="46" class="node-title">PR Merge Gate</text>
    <text x="14" y="64" class="node-sub">Maintainer checks diff &amp; logs</text>
    <text x="14" y="80" class="node-metric">— 0.00 AIU (Human merge)</text>
  </g>

  <!-- ================= BOTTOM FOOTER EXPLANATION ================= -->
  <g transform="translate(30, 385)">
    <rect width="900" height="72" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1px" />
    <text x="16" y="22" class="footer-note" font-weight="600" fill="var(--text)">
      Governed Supervised Flow: Row 1 (Intake &amp; Scope Gate) → Row 2 (Implementation, Verification &amp; Delivery)
    </text>
    <text x="16" y="42" class="footer-note">
      • Amber double-bordered nodes are mandatory human approval checkpoints (Scope Gate and PR Merge Gate). Both cost 0.00 LLM tokens.
    </text>
    <text x="16" y="58" class="footer-note">
      • Dashed accent loop is the bounded Developer ↔ QA repair cycle (hard-capped at ≤3 attempts; 4th failure pauses the pipeline and escalates to maintainer).
    </text>
  </g>
</svg>
