    <line x1="16" y1="58" x2="120" y2="58" stroke="#FDE68A" stroke-width="1" />
    <text x="68" y="76" class="font-mono" fill="#B45309" text-anchor="middle">/create-pr</text>
    <text x="68" y="94" class="font-body" fill="#78350F" text-anchor="middle">Human merge</text>
    <text x="68" y="112" class="font-body" fill="#78350F" text-anchor="middle">(0 auto-merge)</text>
    <text x="68" y="130" class="font-body" fill="#B45309" font-weight="600" text-anchor="middle">Human sign-off</text>
  </g>

  <!-- ==================== FOOTER CAPTION ==================== -->
  <text x="550" y="420" class="font-caption" fill="#64748B" text-anchor="middle">"4 Deterministic Hook Engines intercept tool execution · 2 Human Approval Gates enforce scope &amp; PR · @prsquad orchestrates structured stage handoffs"</text>
</svg>
