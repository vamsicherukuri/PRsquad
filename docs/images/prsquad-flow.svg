  <g transform="translate(562, 24)">
    <circle cx="68" cy="-6" r="11" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2" />
    <text x="68" y="-2" class="font-badge" fill="#EA580C" text-anchor="middle">3</text>
    <rect x="0" y="8" width="136" height="66" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="68" y="25" class="font-sub" fill="#2563EB" text-anchor="middle">🪝 [preToolUse]</text>
    <text x="68" y="42" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-enforce-scope</text>
    <text x="68" y="57" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-sandbox-bash</text>
  </g>
  <!-- Connector Hook 3 -> Stage 3 (Developer) -->
  <path d="M 630 98 L 630 145 L 546 145 L 546 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />

  <!-- HOOK 4 (Sandbox Bash) -->
  <g transform="translate(713, 24)">
    <circle cx="68" cy="-6" r="11" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2" />
    <text x="68" y="-2" class="font-badge" fill="#EA580C" text-anchor="middle">4</text>
    <rect x="0" y="8" width="136" height="66" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="68" y="27" class="font-sub" fill="#2563EB" text-anchor="middle">🪝 [preToolUse]</text>
    <text x="68" y="44" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-sandbox-bash</text>
    <text x="68" y="60" class="font-body" fill="#64748B" text-anchor="middle">permit test, block push/git</text>
  </g>
  <!-- Connector Hook 4 -> Stage 4 (QA) & Stage 5 (Review) -->
  <path d="M 781 98 L 781 145 L 697 145 L 697 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />
  <path d="M 781 145 L 848 145 L 848 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />

  <!-- HOOK 2B (PR Gate & Telemetry) -->
  <g transform="translate(931, 24)">
    <circle cx="68" cy="-6" r="11" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2" />
    <text x="68" y="-2" class="font-badge" fill="#EA580C" text-anchor="middle">2</text>
    <rect x="0" y="8" width="136" height="66" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="68" y="27" class="font-sub" fill="#2563EB" text-anchor="middle">🪝 [postToolUse]</text>
    <text x="68" y="44" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-verify-gate</text>
    <text x="68" y="60" class="font-body" fill="#64748B" text-anchor="middle">AI credits &amp; PR eligibility</text>
  </g>
  <!-- Connector Hook 2B -> Gate 2 (PR Gate) -->
  <path d="M 999 98 L 999 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />

  <!-- ==================== ORCHESTRATOR DELEGATION BUS ==================== -->
  <path d="M 437 138 L 437 185" stroke="#64748B" stroke-width="1.5" fill="none" />
  <!-- Main bus horizontal trunk -->
  <path d="M 93 185 L 848 185" stroke="#64748B" stroke-width="1.5" fill="none" />
  <!-- Bus drop-lines to 5 specialist agents -->
  <path d="M 93 185 L 93 234" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />
  <path d="M 244 185 L 244 234" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />
  <path d="M 546 185 L 546 234" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />
  <path d="M 697 185 L 697 234" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />
  <path d="M 848 185 L 848 234" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

