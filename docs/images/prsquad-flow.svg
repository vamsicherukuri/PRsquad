    <rect x="55" y="16" width="110" height="18" rx="9" fill="#DBEAFE" />
    <text x="110" y="29" class="font-pill" fill="#1E40AF" text-anchor="middle">ORCHESTRATOR</text>
    <text x="110" y="52" class="font-title" fill="#1E3A8A" text-anchor="middle">Chat &amp; Delegation</text>
    <text x="110" y="68" class="font-sub" fill="#2563EB" text-anchor="middle">GitHub Copilot App (@prsquad)</text>
    <text x="110" y="85" class="font-body" fill="#475569" text-anchor="middle">Governs 5 Stateless Specialists</text>
    <text x="110" y="100" class="font-body" fill="#64748B" text-anchor="middle">(0 code-editing tools)</text>
  </g>

