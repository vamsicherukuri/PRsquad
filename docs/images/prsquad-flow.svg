    <rect x="28" y="10" width="80" height="18" rx="9" fill="#D1FAE5" />
    <text x="68" y="23" class="font-pill" fill="#065F46" text-anchor="middle">STAGE 2</text>
    <text x="68" y="47" class="font-title" fill="#064E3B" text-anchor="middle">Architect</text>
    <line x1="16" y1="58" x2="120" y2="58" stroke="#A7F3D0" stroke-width="1" />
    <text x="68" y="76" class="font-body" fill="#047857" text-anchor="middle">Root-cause plan</text>
    <text x="68" y="94" class="font-body" fill="#047857" text-anchor="middle">Read-only tools</text>
    <text x="68" y="112" class="font-body" fill="#047857" text-anchor="middle">AST Symbol sweep</text>
    <text x="68" y="130" class="font-body" fill="#64748B" text-anchor="middle">(0 edit tools)</text>
  </g>

  <!-- Sequence Arrow 2 -> Gate 1 -->
  <path d="M 312 313 L 324 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

