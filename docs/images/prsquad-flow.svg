    <line x1="16" y1="58" x2="120" y2="58" stroke="#A7F3D0" stroke-width="1" />
    <text x="68" y="76" class="font-body" fill="#047857" text-anchor="middle">Def. of ready</text>
    <text x="68" y="94" class="font-body" fill="#047857" text-anchor="middle">Zero-tool air-gap</text>
    <text x="68" y="112" class="font-body" fill="#065F46" text-anchor="middle">(0 repo tools)</text>
    <text x="68" y="130" class="font-body" fill="#64748B" text-anchor="middle">Quarantined intake</text>
  </g>

  <!-- Sequence Arrow 1 -> 2 -->
  <path d="M 161 313 L 173 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

