<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="100%" height="100%">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; }
      .font-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
      .font-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 10.5px; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 10.5px; font-weight: 600; }
      .font-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .font-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .font-caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-style: italic; }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
  </defs>

  <!-- Canvas Card Container -->
  <rect x="0" y="0" width="1100" height="450" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- ==================== TOP ROW: HOOKS & ORCHESTRATOR ==================== -->

  <!-- HOOK 1 (Intake) -->
  <g transform="translate(25, 24)">
    <circle cx="68" cy="-6" r="11" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2" />
    <text x="68" y="-2" class="font-badge" fill="#EA580C" text-anchor="middle">1</text>
    <rect x="0" y="8" width="136" height="66" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="68" y="27" class="font-sub" fill="#2563EB" text-anchor="middle">🪝 [preToolUse]</text>
    <text x="68" y="44" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-intake-ingest</text>
    <text x="68" y="60" class="font-body" fill="#64748B" text-anchor="middle">quarantine &amp; prompt strip</text>
  </g>
  <!-- Connector Hook 1 -> Stage 1 -->
  <path d="M 93 98 L 93 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />

  <!-- HOOK 2A (Scope Gate) -->
  <g transform="translate(176, 24)">
    <circle cx="68" cy="-6" r="11" fill="#FFEDD5" stroke="#FDBA74" stroke-width="1.2" />
    <text x="68" y="-2" class="font-badge" fill="#EA580C" text-anchor="middle">2</text>
    <rect x="0" y="8" width="136" height="66" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
    <text x="68" y="27" class="font-sub" fill="#2563EB" text-anchor="middle">🪝 [preToolUse]</text>
    <text x="68" y="44" class="font-mono" fill="#1E3A8A" text-anchor="middle">hook-verify-gate</text>
    <text x="68" y="60" class="font-body" fill="#64748B" text-anchor="middle">check approval.lock</text>
  </g>
  <!-- Connector Hook 2 -> Gate 1 -->
  <path d="M 244 98 L 244 140 L 395 140 L 395 234" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-orange)" />

