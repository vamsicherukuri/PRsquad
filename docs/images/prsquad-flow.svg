    <rect x="28" y="10" width="80" height="18" rx="9" fill="#FEF3C7" />
    <text x="68" y="23" class="font-pill" fill="#B45309" text-anchor="middle">🔒 GATE 1</text>
    <text x="68" y="47" class="font-title" fill="#92400E" text-anchor="middle">Scope Gate</text>
    <line x1="16" y1="58" x2="120" y2="58" stroke="#FDE68A" stroke-width="1" />
    <text x="68" y="76" class="font-mono" fill="#B45309" text-anchor="middle">/approve</text>
    <text x="68" y="94" class="font-mono" fill="#B45309" text-anchor="middle">approval.lock</text>
    <text x="68" y="112" class="font-body" fill="#78350F" text-anchor="middle">AI Meter table</text>
    <text x="68" y="130" class="font-body" fill="#B45309" font-weight="600" text-anchor="middle">Human sign-off</text>
  </g>

  <!-- Sequence Arrow Gate 1 -> 3 -->
  <path d="M 463 313 L 475 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- STAGE 3: Developer -->
  <g transform="translate(478, 242)">
    <rect x="0" y="0" width="136" height="142" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <rect x="28" y="10" width="80" height="18" rx="9" fill="#D1FAE5" />
    <text x="68" y="23" class="font-pill" fill="#065F46" text-anchor="middle">STAGE 3</text>
    <text x="68" y="47" class="font-title" fill="#064E3B" text-anchor="middle">Developer</text>
    <line x1="16" y1="58" x2="120" y2="58" stroke="#A7F3D0" stroke-width="1" />
    <text x="68" y="76" class="font-body" fill="#047857" text-anchor="middle">Fix + test suite</text>
    <text x="68" y="94" class="font-body" fill="#047857" text-anchor="middle">Isolated worktree</text>
    <text x="68" y="112" class="font-body" fill="#047857" text-anchor="middle">OS write barrier</text>
    <text x="68" y="130" class="font-body" fill="#64748B" text-anchor="middle">Enforced scope</text>
  </g>

  <!-- Sequence Arrow 3 -> 4 -->
  <path d="M 614 313 L 626 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- STAGE 4: QA Specialist -->
  <g transform="translate(629, 242)">
    <rect x="0" y="0" width="136" height="142" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <rect x="28" y="10" width="80" height="18" rx="9" fill="#D1FAE5" />
    <text x="68" y="23" class="font-pill" fill="#065F46" text-anchor="middle">STAGE 4</text>
    <text x="68" y="47" class="font-title" fill="#064E3B" text-anchor="middle">QA Specialist</text>
    <line x1="16" y1="58" x2="120" y2="58" stroke="#A7F3D0" stroke-width="1" />
    <text x="68" y="76" class="font-body" fill="#047857" text-anchor="middle">Criteria tests</text>
    <text x="68" y="94" class="font-body" fill="#047857" text-anchor="middle">Bash sandbox</text>
    <text x="68" y="112" class="font-body" fill="#047857" text-anchor="middle">No mutating git</text>
    <text x="68" y="130" class="font-body" fill="#64748B" text-anchor="middle">Bounded retries (≤3)</text>
  </g>

  <!-- Sequence Arrow 4 -> 5 -->
  <path d="M 765 313 L 777 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- STAGE 5: Reviewer -->
  <g transform="translate(780, 242)">
    <rect x="0" y="0" width="136" height="142" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <rect x="28" y="10" width="80" height="18" rx="9" fill="#D1FAE5" />
    <text x="68" y="23" class="font-pill" fill="#065F46" text-anchor="middle">STAGE 5</text>
    <text x="68" y="47" class="font-title" fill="#064E3B" text-anchor="middle">Reviewer</text>
    <line x1="16" y1="58" x2="120" y2="58" stroke="#A7F3D0" stroke-width="1" />
    <text x="68" y="76" class="font-body" fill="#047857" text-anchor="middle">Read-only diff</text>
    <text x="68" y="94" class="font-body" fill="#047857" text-anchor="middle">Security check</text>
    <text x="68" y="112" class="font-body" fill="#047857" text-anchor="middle">Audit trail inspect</text>
    <text x="68" y="130" class="font-body" fill="#64748B" text-anchor="middle">Independent review</text>
  </g>

  <!-- Sequence Arrow 5 -> Gate 2 -->
  <path d="M 916 313 L 928 313" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />

  <!-- GATE 2: PR Gate (Human Gate) -->
  <g transform="translate(931, 242)">
    <rect x="0" y="0" width="136" height="142" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <rect x="28" y="10" width="80" height="18" rx="9" fill="#FEF3C7" />
    <text x="68" y="23" class="font-pill" fill="#B45309" text-anchor="middle">🔒 GATE 2</text>
