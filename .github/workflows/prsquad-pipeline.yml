name: PRsquad Pipeline

# Legacy SDK-based prototype path (src/actions/*.ts) - kept as reference/test-harness material.
# Manual-dispatch only so it never fires automatically alongside the GitHub Copilot App plugin
# (plugins/prsquad) during testing. Provide the issue number to run it intentionally.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to run the legacy SDK pipeline against"
        required: true
        type: number

permissions:
  contents: read
  issues: write

env:
  COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  intake-triage-round-1:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.run.outputs.ready }}
      scope: ${{ steps.run.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: run
        run: npx tsx src/actions/intakeTriage.ts ${{ github.event.inputs.issue_number }} 1

  # implementation-plan.md §4: Intake Triage is capped at 2 rounds. This job only runs if round 1
  # came back "not ready" - each round is its own job/runner, so the handoff and each agent's
  # result are separately inspectable in the workflow graph.
  intake-triage-round-2:
    needs: intake-triage-round-1
    if: needs.intake-triage-round-1.outputs.ready == 'false'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.run.outputs.ready }}
      scope: ${{ steps.run.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: run
        run: npx tsx src/actions/intakeTriage.ts ${{ github.event.inputs.issue_number }} 2

  architect:
    needs: [intake-triage-round-1, intake-triage-round-2]
    if: |
      always() &&
      (needs.intake-triage-round-1.outputs.ready == 'true' || needs.intake-triage-round-2.outputs.ready == 'true')
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.run.outputs.risk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: run
        run: |
          SCOPE="${{ needs.intake-triage-round-1.outputs.scope }}"
          if [ "${{ needs.intake-triage-round-1.outputs.ready }}" != "true" ]; then
            SCOPE="${{ needs.intake-triage-round-2.outputs.scope }}"
          fi
          npx tsx src/actions/architect.ts ${{ github.event.inputs.issue_number }} "$SCOPE"

  # implementation-plan.md §5a/§5g: the Scope gate is a hard block. This job targets a protected
  # GitHub Environment with a required reviewer - the job genuinely pauses ("Waiting") until a
  # human approves or rejects it in the GitHub UI (visible from the GHCP App's "My Work" view).
  # GitHub's native environment approval is binary, so a reject here means "send back entirely"
  # (§5a) rather than the richer 3-action model the CLI orchestrator supports.
  scope-gate:
    needs: architect
    environment: scope-gate-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/actions/scopeGateResult.ts ${{ github.event.inputs.issue_number }} approved

  scope-gate-rejected:
    needs: scope-gate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/actions/scopeGateResult.ts ${{ github.event.inputs.issue_number }} rejected
